name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tradingagents_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tradingagents_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradingagents_test
      STRATEGY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradingagents_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tradingagents_test
      TA_APP_SECRET_KEY: ci-test-secret
      ENABLE_NEWS_EYE_WORKER: "0"
      ENABLE_DAILY_REVIEW_WORKER: "0"
      ALLOW_SERVER_LLM_FALLBACK: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
